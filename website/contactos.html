<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactos — Avançar Liberal</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Contactos</h1>
        <p>Tens uma dúvida, uma sugestão ou queres colaborar? Fala connosco!</p>
      </div>
    </section>

    <section>
      <div class="container grid grid-2" style="gap:3rem;align-items:start">
        <div>
          <span class="eyebrow">Fala connosco</span>
          <h2 style="color:var(--navy);margin-bottom:1.5rem">Estamos aqui para te ouvir</h2>
          <ul class="contact-list">
            <li>
              <div class="icon">📸</div>
              <div><strong>Instagram</strong><a href="https://www.instagram.com/avancarliberal/" target="_blank" rel="noopener">@avancarliberal</a></div>
            </li>
            <li>
              <div class="icon">✉️</div>
              <div><strong>Email</strong><a href="mailto:geral@avancarliberal.pt">geral@avancarliberal.pt</a></div>
            </li>
            <li>
              <div class="icon">📍</div>
              <div><strong>Onde estamos</strong>Portugal 🇵🇹</div>
            </li>
            <li>
              <div class="icon">⏱️</div>
              <div><strong>Tempo de resposta</strong>Respondemos normalmente em 48 horas.</div>
            </li>
          </ul>
        </div>

        <form class="form" data-form="contacto" data-success="Obrigado pela tua mensagem! Entraremos em contacto em breve." novalidate>
          <div class="form-row">
            <div class="field">
              <label for="c-nome">Nome *</label>
              <input id="c-nome" name="nome" required autocomplete="name">
            </div>
            <div class="field">
              <label for="c-email">Email *</label>
              <input id="c-email" name="email" type="email" required autocomplete="email">
            </div>
          </div>
          <div class="field">
            <label for="c-assunto">Assunto</label>
            <select id="c-assunto" name="assunto">
              <option>Pergunta geral</option>
              <option>Sugestão de proposta</option>
              <option>Imprensa</option>
              <option>Parcerias</option>
              <option>Outro</option>
            </select>
          </div>
          <div class="field">
            <label for="c-msg">Mensagem *</label>
            <textarea id="c-msg" name="mensagem" rows="6" required></textarea>
          </div>
          <label class="consent field">
            <input type="checkbox" name="rgpd" required>
            Aceito que os meus dados sejam tratados para efeitos de resposta a este contacto, nos termos do RGPD. *
          </label>
          <button class="btn btn-primary" type="submit">Enviar mensagem</button>
          <div class="form-msg" role="status"></div>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>

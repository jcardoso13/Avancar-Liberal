<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts — Avançar Liberal</title>
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Posts</h1>
        <p>As últimas publicações do Avançar Liberal.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="posts-heading">
          <h2>Instagram</h2>
          <a href="https://www.instagram.com/avancarliberal/" target="_blank" rel="noopener noreferrer">@avancarliberal</a>
        </div>
        <div id="instagram-posts" class="posts-grid" hidden></div>
        <div id="instagram-unavailable" class="posts-unavailable" role="status">
          <p>As publicações não estão disponíveis nesta página de momento.</p>
          <a class="btn btn-blue" href="https://www.instagram.com/avancarliberal/" target="_blank" rel="noopener noreferrer">Ver no Instagram</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/posts.js"></script>
</body>
</html>

  <g id="text_18">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(63.36 389.670781)">Categoria A, solteiro, sem outros rendimentos; deducao especifica de 8,54 IAS ou SS.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(63.36 399.272969)">Hipoteses: IAS 537,13 EUR; minimo 13 580,00 EUR brutos; despesas gerais 250,00 EUR.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(63.36 408.875156)">SS trabalhador: 11.00%; TSU empregador: 23.7500%. Proposta: 0% ate 8 992,91 EUR coletaveis.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(63.36 418.477344)">Custo do trabalho = bruto + TSU. Sem outras deducoes, solidariedade ou custos do empregador.</text>
